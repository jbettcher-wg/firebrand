    <rect x="14" y="16" width="148" height="118" rx="12" fill="#ffffff"/>
    <path d="M22 108 L46 98 L64 104 L84 66 L102 82 L120 46 L140 60 L154 40" fill="none" stroke="#e2551f" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M22 108 L46 98 L64 104 L84 66 L102 82 L120 46 L140 60 L154 40 L154 126 L22 126 Z" fill="#e2551f" fill-opacity="0.18"/>
